
services:
  mysql:
    image: mysql:8.4
    container_name: it-alerts-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: it_alerts_db
      MYSQL_USER: alerts_user
      MYSQL_PASSWORD: alerts_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: it-alerts-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://alerts_user:alerts_password@mysql:3306/it_alerts_db
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: it-alerts-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
